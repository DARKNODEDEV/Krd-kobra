<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krd Kobra AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0a0a; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #000; color: #00ff88; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 1px solid #222; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; }
        .message { max-width: 80%; padding: 12px 16px; margin-bottom: 12px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; }
        .user { background: #0066ff; color: white; margin-right: auto; margin-left: 0; border-bottom-left-radius: 4px; }
        .bot { background: #1a1a1a; color: #e0e0e0; margin-left: auto; margin-right: 0; border-bottom-right-radius: 4px; }
        #input-area { display: flex; padding: 15px; background: #111; border-top: 1px solid #222; gap: 10px; }
        #user-input { flex: 1; padding: 12px 16px; background: #1a1a1a; border: 1px solid #333; border-radius: 25px; color: #e0e0e0; font-size: 15px; outline: none; }
        #user-input:focus { border-color: #00ff88; }
        #send-btn { background: #00ff88; color: #000; border: none; border-radius: 25px; padding: 12px 24px; font-size: 15px; font-weight: bold; cursor: pointer; }
        #send-btn:hover { background: #00cc6a; }
        #send-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>🤖 Krd Kobra AI</header>
    <div id="chat-box"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="نامەیەک بنووسە..." autocomplete="off">
        <button id="send-btn">ناردن</button>
    </div>
    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            addMessage(message, 'user');
            userInput.value = '';
            sendBtn.disabled = true;
            sendBtn.textContent = '...';
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                if (data.reply) addMessage(data.reply, 'bot');
                else addMessage('هەڵە: ' + (data.error || 'نەزانراو'), 'bot');
            } catch (err) {
                addMessage('هەڵەی پەیوەندی: ' + err.message, 'bot');
            }
            sendBtn.disabled = false;
            sendBtn.textContent = 'ناردن';
            userInput.focus();
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        userInput.focus();
    </script>
</body>
</html>
